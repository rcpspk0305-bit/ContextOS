[project]
name = "contextos"
version = "0.1.0"
description = "ContextOS — Local-first AI Operating Layer and Context Broker"
authors = [{ name = "ContextOS Authors" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "mcp>=1.2.0",
    "aiosqlite>=0.20.0",
    "starlette>=0.38.0",
    "websockets>=12.0",
    "GitPython>=3.1.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
